name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # The catalog points at external registries; a weekly run catches upstream renames.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies, so there is nothing to install.
      - run: node scripts/check-syntax.mjs
      - run: node --test

  catalog:
    name: Catalog resolves against live registries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/catalog.test.mjs
        env:
          LOCALCODE_NETWORK_TESTS: "1"
